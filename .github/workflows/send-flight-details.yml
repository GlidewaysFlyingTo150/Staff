name: Send scheduled flight details

on:
  schedule:
    # Every 15 minutes. GitHub may delay this slightly under load — this
    # isn't a to-the-second guarantee, just "within roughly 15-30 minutes
    # of the 2-day mark."
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  send-flight-details:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Send due flight-details announcements
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FLIGHT_DETAILS_WEBHOOK_URL: ${{ secrets.FLIGHT_DETAILS_WEBHOOK_URL }}
        run: node scripts/send-flight-details.js
